name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build --if-present
            if [ -d "android" ]; then
              npx cap sync android || true
            fi
          fi

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Unsigned Release APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Sign APK with apksigner
        run: |
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/apksigner sign \
            --ks $GITHUB_WORKSPACE/release.keystore \
            --ks-pass pass:"${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out $GITHUB_WORKSPACE/app-release-signed.apk \
            "$APK_PATH"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          
